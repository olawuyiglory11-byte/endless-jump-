<!DOCTYPE html>
<html>
<head>
  <title>Mini Runner</title>
  <style>
    body { margin: 0; overflow: hidden; background: #eee; }
    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #cce;
    }
    #pauseButton {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #player {
      width: 50px;
      height: 50px;
      background: #f33;
      position: absolute;
      bottom: 0;
      left: 50px;
      z-index: 1;
    }
    .obstacle {
      position: absolute;
      bottom: 0;
      right: -80px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      line-height: 1;
      user-select: none;
    }
    .cactus { width: 46px; height: 58px; font-size: 54px; }
    .car { width: 64px; height: 44px; font-size: 48px; }
    .bus { width: 82px; height: 58px; font-size: 58px; }
  </style>
</head>
<body>
  <div id="game">
    <button id="pauseButton" type="button" aria-label="Pause game">Pause</button>
    <div id="player"></div>
  </div>

  <script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const pauseButton = document.getElementById("pauseButton");
    const obstacleTypes = [
      { name: "cactus", icon: "🌵", width: 46 },
      { name: "car", icon: "🚗", width: 64 },
      { name: "bus", icon: "🚌", width: 82 }
    ];

    let jumping = false;
    let velocity = 0;
    const gravity = 0.6;
    const obstacleSpeed = 6;
    let gameOver = false;
    let paused = false;
    let spawnTimer = null;

    function jump() {
      if (!jumping && !gameOver && !paused) {
        jumping = true;
        velocity = 12;
      }
    }

    function togglePause() {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
      pauseButton.setAttribute("aria-label", paused ? "Resume game" : "Pause game");

      if (paused) {
        window.clearTimeout(spawnTimer);
        spawnTimer = null;
      } else {
        spawnTimer = window.setTimeout(spawnObstacle, 700);
        update();
      }
    }

    pauseButton.addEventListener("pointerdown", (event) => event.stopPropagation());
    pauseButton.addEventListener("click", togglePause);

    document.addEventListener("keydown", (event) => {
      if (event.code === "KeyP" || event.code === "Escape") {
        event.preventDefault();
        togglePause();
      } else if (event.code === "ArrowUp" || event.code === "Space") {
        event.preventDefault();
        jump();
      }
    });
    game.addEventListener("pointerdown", jump);

    function spawnObstacle() {
      if (gameOver || paused) return;

      const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      const obstacle = document.createElement("div");
      obstacle.className = `obstacle ${type.name}`;
      obstacle.textContent = type.icon;
      obstacle.setAttribute("aria-label", type.name);
      obstacle.style.right = `-${type.width}px`;
      game.appendChild(obstacle);

      // Vary the gap so obstacles don't arrive in a fixed pattern.
      const nextSpawnDelay = 900 + Math.random() * 1100;
      spawnTimer = window.setTimeout(spawnObstacle, nextSpawnDelay);
    }

    function update() {
      if (gameOver || paused) return;

      if (jumping) {
        let bottom = parseFloat(player.style.bottom) || 0;
        bottom += velocity;
        velocity -= gravity;

        if (bottom <= 0) {
          bottom = 0;
          velocity = 0;
          jumping = false;
        }

        player.style.bottom = bottom + "px";
      }

      const playerRect = player.getBoundingClientRect();
      document.querySelectorAll(".obstacle").forEach((obstacle) => {
        const right = parseFloat(getComputedStyle(obstacle).right) + obstacleSpeed;
        obstacle.style.right = right + "px";

        if (right > window.innerWidth + obstacle.offsetWidth) {
          obstacle.remove();
          return;
        }

        const obstacleRect = obstacle.getBoundingClientRect();
        if (
          playerRect.left < obstacleRect.right &&
          playerRect.right > obstacleRect.left &&
          playerRect.bottom > obstacleRect.top &&
          playerRect.top < obstacleRect.bottom
        ) {
          gameOver = true;
          alert("Game Over!");
          window.location.reload();
        }
      });

      if (!paused) requestAnimationFrame(update);
    }

    spawnTimer = window.setTimeout(spawnObstacle, 700);
    update();
  </script>
</body>
</html>
