<!DOCTYPE html>
<html>
<head>
  <title>Mini Runner</title>
  <style>
    body { margin: 0; overflow: hidden; background: #eee; }
    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #cce;
    }
    #player {
      width: 50px;
      height: 50px;
      background: #f33;
      position: absolute;
      bottom: 0;
      left: 50px;
    }
    #obstacle {
      width: 40px;
      height: 40px;
      background: #333;
      position: absolute;
      bottom: 0;
      right: -40px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="player"></div>
    <div id="obstacle"></div>
  </div>

  <script>
    const player = document.getElementById("player");
    const obstacle = document.getElementById("obstacle");

    let jumping = false;
    let velocity = 0;
    const gravity = 0.6;

    function jump() {
      if (!jumping) {
        jumping = true;
        velocity = 12;
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "ArrowUp" || event.code === "Space") {
        event.preventDefault();
        jump();
      }
    });

    function update() {
      if (jumping) {
        let bottom = parseFloat(player.style.bottom) || 0;
        bottom += velocity;
        velocity -= gravity;

        if (bottom <= 0) {
          bottom = 0;
          velocity = 0;
          jumping = false;
        }

        player.style.bottom = bottom + "px";
      }

      let obstacleRight = parseFloat(getComputedStyle(obstacle).right) + 6;
      if (obstacleRight > window.innerWidth + 40) {
        obstacleRight = -40;
      }
      obstacle.style.right = obstacleRight + "px";

      const playerRect = player.getBoundingClientRect();
      const obstacleRect = obstacle.getBoundingClientRect();
      if (
        playerRect.left < obstacleRect.right &&
        playerRect.right > obstacleRect.left &&
        playerRect.bottom > obstacleRect.top
      ) {
        alert("Game Over!");
        window.location.reload();
        return;
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
